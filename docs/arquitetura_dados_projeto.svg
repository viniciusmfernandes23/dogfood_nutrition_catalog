<svg width="1850" height="520" viewBox="0 0 1850 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura de Dados do Projeto</title>
  <desc id="desc">Arquitetura atual do projeto: fontes e-commerce, Bronze, Prata, Ouro, Power BI e IA como apoio transversal, com fluxo real de coleta, parsing, normalização, validação, warehouse e analytics.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f7f9fc"/>
      <stop offset="100%" stop-color="#edf4fb"/>
    </linearGradient>
    <linearGradient id="bronzeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6ee"/>
      <stop offset="100%" stop-color="#f8dfc8"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#edf9f7"/>
      <stop offset="100%" stop-color="#d7efe9"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff9e8"/>
      <stop offset="100%" stop-color="#f7e7a6"/>
    </linearGradient>
    <linearGradient id="biGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123a5d"/>
      <stop offset="100%" stop-color="#1a577f"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#123a5d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L0,12 L12,6 z" fill="#3e5e7e"/>
    </marker>
    <style>
      .title { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #183d5f; }
      .small { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #536a84; }
      .chip { font: 700 11px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .card { font: 700 13px 'Segoe UI', Arial, sans-serif; fill: #1b2f46; }
      .note { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #23486f; }
    </style>
  </defs>

  <rect x="0" y="0" width="1850" height="520" fill="url(#bg)"/>

  <g>
    <rect x="580" y="18" width="690" height="54" rx="26" fill="#ffffff" stroke="#dfeaf7" filter="url(#shadow)"/>
    <circle cx="620" cy="45" r="15" fill="#6d7ef5"/>
    <path d="M614 45h12 M620 39v12" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text x="650" y="50" class="small" style="font-size: 17px; fill: #23486f;">IA transversal</text>
    <text x="915" y="50" class="small" style="font-size: 12px; fill: #64798f;">apoio ao desenvolvimento, validação e revisão — não é etapa automática do pipeline</text>
  </g>

  <g>
    <line x1="265" y1="260" x2="310" y2="260" stroke="#3e5e7e" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="595" y1="260" x2="630" y2="260" stroke="#3e5e7e" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="930" y1="260" x2="970" y2="260" stroke="#3e5e7e" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="1225" y1="260" x2="1268" y2="260" stroke="#3e5e7e" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="1546" y1="260" x2="1595" y2="260" stroke="#3e5e7e" stroke-width="4" marker-end="url(#arrow)"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="35" y="120" width="230" height="260" rx="22" fill="#ffffff" stroke="#dfeaf7"/>
    <rect x="56" y="138" width="188" height="30" rx="15" fill="#e9eef9"/>
    <text x="150" y="158" text-anchor="middle" class="small">FONTES / ENTRADAS</text>

    <g>
      <rect x="68" y="190" width="166" height="40" rx="10" fill="#edf3ff"/>
      <circle cx="88" cy="210" r="8" fill="#4e82c5"/>
      <path d="M85 210h6 M88 207v6" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <text x="108" y="216" class="card">Cobasi</text>
    </g>

    <g>
      <rect x="68" y="240" width="166" height="40" rx="10" fill="#f1f7ff"/>
      <circle cx="88" cy="260" r="8" fill="#67a6d5"/>
      <path d="M85 260h6 M88 257v6" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <text x="108" y="266" class="card">Petlove</text>
    </g>

    <g>
      <rect x="68" y="290" width="166" height="40" rx="10" fill="#edf3ff"/>
      <circle cx="88" cy="310" r="8" fill="#4d6ea3"/>
      <path d="M85 310h6 M88 307v6" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <text x="108" y="316" class="card">Petz</text>
    </g>

    <text x="150" y="355" text-anchor="middle" class="small">marketplaces e-commerce</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="310" y="120" width="285" height="260" rx="22" fill="url(#bronzeGrad)" stroke="#efcfad"/>
    <rect x="334" y="140" width="118" height="22" rx="11" fill="#d77d3e"/>
    <text x="393" y="156" text-anchor="middle" class="chip">BRONZE</text>
    <text x="452" y="198" text-anchor="middle" class="title">Dados brutos</text>

    <g>
      <rect x="332" y="212" width="236" height="32" rx="10" fill="#fff3e7" stroke="#f0d0a6"/>
      <text x="450" y="233" text-anchor="middle" class="card">Collectors / Ingestão</text>
    </g>
    <g>
      <rect x="332" y="255" width="236" height="32" rx="10" fill="#fffaf5" stroke="#f0d0a6"/>
      <text x="450" y="276" text-anchor="middle" class="card">Arquivos e registros originais</text>
    </g>

    <text x="452" y="352" text-anchor="middle" class="note">Bronze = dado bruto</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="630" y="120" width="300" height="260" rx="22" fill="url(#silverGrad)" stroke="#cfeae3"/>
    <rect x="654" y="140" width="118" height="22" rx="11" fill="#2e9b8d"/>
    <text x="713" y="156" text-anchor="middle" class="chip">PRATA</text>
    <text x="780" y="198" text-anchor="middle" class="title">Dados confiáveis</text>

    <g>
      <rect x="650" y="212" width="120" height="32" rx="10" fill="#e5f7f4" stroke="#c5e6df"/>
      <text x="710" y="233" text-anchor="middle" class="card">Parsing</text>
    </g>
    <g>
      <rect x="782" y="212" width="122" height="32" rx="10" fill="#eafcf9" stroke="#c5e6df"/>
      <text x="843" y="233" text-anchor="middle" class="card">Enrichment</text>
    </g>
    <g>
      <rect x="650" y="256" width="120" height="32" rx="10" fill="#edfdf9" stroke="#c5e6df"/>
      <text x="710" y="277" text-anchor="middle" class="card">Normalization</text>
    </g>
    <g>
      <rect x="782" y="256" width="122" height="32" rx="10" fill="#edfdf9" stroke="#c5e6df"/>
      <text x="843" y="277" text-anchor="middle" class="card">Validation</text>
    </g>

    <text x="780" y="352" text-anchor="middle" class="note">Prata = dado confiável, tratado e validado</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="970" y="120" width="255" height="260" rx="22" fill="url(#goldGrad)" stroke="#e7d58d"/>
    <rect x="992" y="140" width="118" height="22" rx="11" fill="#c7a726"/>
    <text x="1051" y="156" text-anchor="middle" class="chip">OURO</text>
    <text x="1098" y="198" text-anchor="middle" class="title">Dados analíticos</text>

    <g>
      <rect x="994" y="212" width="230" height="32" rx="10" fill="#fff8dd" stroke="#efd98d"/>
      <text x="1109" y="233" text-anchor="middle" class="card">Warehouse / Export</text>
    </g>
    <g>
      <rect x="994" y="256" width="230" height="32" rx="10" fill="#fffdf4" stroke="#efd98d"/>
      <text x="1109" y="277" text-anchor="middle" class="card">Relatórios e métricas</text>
    </g>

    <text x="1098" y="352" text-anchor="middle" class="note">Ouro = dado pronto para análise</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1268" y="120" width="278" height="260" rx="22" fill="url(#biGrad)" stroke="#274d72"/>
    <rect x="1288" y="140" width="112" height="24" rx="12" fill="#65cdd8"/>
    <text x="1344" y="157" text-anchor="middle" class="chip">POWER BI</text>
    <text x="1407" y="198" text-anchor="middle" class="title" style="fill:#ffffff;">Analítica</text>

    <g>
      <rect x="1294" y="212" width="80" height="38" rx="9" fill="#1f6d92"/>
      <text x="1334" y="237" text-anchor="middle" class="chip">Power Query</text>
    </g>
    <g>
      <rect x="1384" y="212" width="116" height="38" rx="9" fill="#1f6d92"/>
      <text x="1442" y="237" text-anchor="middle" class="chip">Modelo semântico</text>
    </g>
    <g>
      <rect x="1294" y="260" width="206" height="38" rx="9" fill="#244d72"/>
      <text x="1397" y="285" text-anchor="middle" class="chip">DAX + dashboards</text>
    </g>

    <text x="1407" y="352" text-anchor="middle" class="note" style="fill:#dfeeff;">comparação, análise e decisão</text>
  </g>

  <g>
    <rect x="1595" y="120" width="220" height="260" rx="22" fill="#ffffff" stroke="#dfeaf7"/>
    <rect x="1616" y="140" width="64" height="22" rx="11" fill="#5a6ef5"/>
    <text x="1648" y="156" text-anchor="middle" class="chip">BI</text>
    <text x="1705" y="198" text-anchor="middle" class="title">Consumo final</text>

    <g>
      <rect x="1616" y="212" width="178" height="30" rx="9" fill="#eef3ff"/>
      <text x="1705" y="232" text-anchor="middle" class="card">Análise estratégica</text>
    </g>
    <g>
      <rect x="1616" y="256" width="178" height="30" rx="9" fill="#eef3ff"/>
      <text x="1705" y="276" text-anchor="middle" class="card">Comparação de mercado</text>
    </g>
    <g>
      <rect x="1616" y="300" width="178" height="30" rx="9" fill="#eef3ff"/>
      <text x="1705" y="320" text-anchor="middle" class="card">Decisão e ação</text>
    </g>
  </g>

  <g>
    <line x1="300" y1="206" x2="300" y2="310" stroke="#a8b6c8" stroke-width="2" stroke-dasharray="5 6"/>
    <line x1="560" y1="210" x2="560" y2="312" stroke="#a8b6c8" stroke-width="2" stroke-dasharray="5 6"/>
    <line x1="930" y1="210" x2="930" y2="312" stroke="#a8b6c8" stroke-width="2" stroke-dasharray="5 6"/>
    <line x1="1225" y1="210" x2="1225" y2="312" stroke="#a8b6c8" stroke-width="2" stroke-dasharray="5 6"/>
    <line x1="1546" y1="214" x2="1546" y2="314" stroke="#a8b6c8" stroke-width="2" stroke-dasharray="5 6"/>
  </g>
</svg>
