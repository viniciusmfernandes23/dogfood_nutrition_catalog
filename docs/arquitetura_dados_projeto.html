<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arquitetura de Dados do Projeto</title>
    <style>
      body {
        margin: 0;
        background: #eef4fb;
        font-family: "Segoe UI", Arial, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      .frame {
        width: min(96vw, 1800px);
        background: #f7f9fc;
        border: 1px solid #dfeaf7;
        border-radius: 18px;
        box-shadow: 0 18px 30px rgba(18, 58, 93, 0.08);
        padding: 18px;
      }
      img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <img src="./arquitetura_dados_projeto.svg" alt="Arquitetura de dados com Bronze, Prata, Ouro e Power BI" />
    </div>
  </body>
</html>
