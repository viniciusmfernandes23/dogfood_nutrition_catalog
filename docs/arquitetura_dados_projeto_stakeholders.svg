<svg width="1700" height="560" viewBox="0 0 1700 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura de Dados do Projeto — Visão Executiva</title>
  <desc id="desc">Visão executiva da arquitetura de dados do projeto, com fluxo de coleta, Bronze, Prata, Ouro e Power BI, e IA como apoio transversal.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5f8fc"/>
      <stop offset="100%" stop-color="#edf3fa"/>
    </linearGradient>
    <linearGradient id="bronzeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4ea"/>
      <stop offset="100%" stop-color="#f9e0c7"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfaf7"/>
      <stop offset="100%" stop-color="#d9f0ea"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbe9"/>
      <stop offset="100%" stop-color="#f6e5a7"/>
    </linearGradient>
    <linearGradient id="biGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123a5d"/>
      <stop offset="100%" stop-color="#1a557f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#123a5d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L0,12 L12,6 z" fill="#3b5d7d"/>
    </marker>
    <style>
      .title { font: 700 32px 'Segoe UI', Arial, sans-serif; fill: #133a5a; }
      .subtitle { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #5d728c; }
      .label { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #143a5a; }
      .tag { font: 700 11px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .card { font: 700 13px 'Segoe UI', Arial, sans-serif; fill: #1d2f46; }
      .small { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #516a81; }
      .white { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect x="0" y="0" width="1700" height="560" fill="url(#bg)"/>

  <g>
    <rect x="430" y="30" width="840" height="68" rx="34" fill="#ffffff" stroke="#dfeaf7" filter="url(#shadow)"/>
    <text x="850" y="72" text-anchor="middle" class="title">Arquitetura de Dados e Analytics</text>
    <text x="850" y="92" text-anchor="middle" class="subtitle">Fluxo de valor do dado do marketplace para decisão de negócio</text>
  </g>

  <g>
    <rect x="1520" y="128" width="120" height="48" rx="20" fill="#ffffff" stroke="#dfeaf7" filter="url(#shadow)"/>
    <circle cx="1548" cy="152" r="12" fill="#6e7ff2"/>
    <path d="M1542 152h12 M1548 146v12" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text x="1568" y="157" class="small">IA</text>
  </g>

  <g>
    <line x1="223" y1="285" x2="285" y2="285" stroke="#3a5d7a" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="485" y1="285" x2="554" y2="285" stroke="#3a5d7a" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="779" y1="285" x2="848" y2="285" stroke="#3a5d7a" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="1092" y1="285" x2="1160" y2="285" stroke="#3a5d7a" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="1381" y1="285" x2="1458" y2="285" stroke="#3a5d7a" stroke-width="4" marker-end="url(#arrow)"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="40" y="150" width="180" height="270" rx="20" fill="#ffffff" stroke="#dfeaf7"/>
    <rect x="62" y="170" width="136" height="30" rx="15" fill="#eaf0fb"/>
    <text x="130" y="190" text-anchor="middle" class="small">FONTES</text>

    <g>
      <rect x="62" y="216" width="136" height="38" rx="10" fill="#edf4ff"/>
      <circle cx="80" cy="235" r="7" fill="#4c7fbd"/>
      <text x="96" y="240" class="card">Cobasi</text>
    </g>
    <g>
      <rect x="62" y="263" width="136" height="38" rx="10" fill="#f3f8ff"/>
      <circle cx="80" cy="282" r="7" fill="#66a3d8"/>
      <text x="96" y="287" class="card">Petlove</text>
    </g>
    <g>
      <rect x="62" y="310" width="136" height="38" rx="10" fill="#edf4ff"/>
      <circle cx="80" cy="329" r="7" fill="#4d6ea3"/>
      <text x="96" y="334" class="card">Petz</text>
    </g>

    <text x="130" y="385" text-anchor="middle" class="small">marketplaces e-commerce</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="285" y="150" width="200" height="270" rx="22" fill="url(#bronzeGrad)" stroke="#f0d0a6"/>
    <rect x="306" y="170" width="110" height="22" rx="11" fill="#d77e3a"/>
    <text x="361" y="186" text-anchor="middle" class="tag">BRONZE</text>
    <text x="385" y="228" text-anchor="middle" class="label">Dados brutos</text>
    <rect x="306" y="245" width="158" height="34" rx="10" fill="#fff2e5" stroke="#f0d0a6"/>
    <text x="385" y="267" text-anchor="middle" class="card">Coleta e ingestão</text>
    <rect x="306" y="292" width="158" height="34" rx="10" fill="#fffaf5" stroke="#f0d0a6"/>
    <text x="385" y="314" text-anchor="middle" class="card">Registros originais</text>
    <text x="385" y="382" text-anchor="middle" class="small">Bronze = dado bruto</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="554" y="150" width="225" height="270" rx="22" fill="url(#silverGrad)" stroke="#cfe9e2"/>
    <rect x="575" y="170" width="110" height="22" rx="11" fill="#2e9b8d"/>
    <text x="630" y="186" text-anchor="middle" class="tag">PRATA</text>
    <text x="666" y="228" text-anchor="middle" class="label">Dados confiáveis</text>
    <rect x="575" y="245" width="88" height="34" rx="10" fill="#e3f7f3" stroke="#c4e7df"/>
    <text x="619" y="267" text-anchor="middle" class="card">Parsing</text>
    <rect x="676" y="245" width="83" height="34" rx="10" fill="#e8fbf8" stroke="#c4e7df"/>
    <text x="717" y="267" text-anchor="middle" class="card">Enrichment</text>
    <rect x="575" y="292" width="88" height="34" rx="10" fill="#ecfdf9" stroke="#c4e7df"/>
    <text x="619" y="314" text-anchor="middle" class="card">Normalização</text>
    <rect x="676" y="292" width="83" height="34" rx="10" fill="#ecfdf9" stroke="#c4e7df"/>
    <text x="717" y="314" text-anchor="middle" class="card">Validação</text>
    <text x="666" y="382" text-anchor="middle" class="small">Prata = dado tratado e validado</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="848" y="150" width="244" height="270" rx="22" fill="url(#goldGrad)" stroke="#eedb98"/>
    <rect x="869" y="170" width="110" height="22" rx="11" fill="#caa82a"/>
    <text x="924" y="186" text-anchor="middle" class="tag">OURO</text>
    <text x="970" y="228" text-anchor="middle" class="label">Dados analíticos</text>
    <rect x="869" y="245" width="196" height="34" rx="10" fill="#fff8db" stroke="#efd98a"/>
    <text x="967" y="267" text-anchor="middle" class="card">Warehouse / Export</text>
    <rect x="869" y="292" width="196" height="34" rx="10" fill="#fffdf4" stroke="#efd98a"/>
    <text x="967" y="314" text-anchor="middle" class="card">Relatórios e métricas</text>
    <text x="970" y="382" text-anchor="middle" class="small">Ouro = dado pronto para análise</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1160" y="150" width="220" height="270" rx="22" fill="url(#biGrad)" stroke="#294d72"/>
    <rect x="1182" y="170" width="118" height="22" rx="11" fill="#68d0db"/>
    <text x="1241" y="186" text-anchor="middle" class="tag">POWER BI</text>
    <text x="1270" y="228" text-anchor="middle" class="label" style="fill:#ffffff;">Consumo e análise</text>
    <rect x="1182" y="245" width="80" height="38" rx="9" fill="#1a6b90"/>
    <text x="1222" y="270" text-anchor="middle" class="white">Query</text>
    <rect x="1270" y="245" width="92" height="38" rx="9" fill="#1a6b90"/>
    <text x="1316" y="270" text-anchor="middle" class="white">Modelo</text>
    <rect x="1182" y="296" width="180" height="40" rx="9" fill="#224d72"/>
    <text x="1272" y="322" text-anchor="middle" class="white">DAX + dashboards</text>
    <text x="1270" y="382" text-anchor="middle" class="small" style="fill:#dfeeff;">Comparação e decisão</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1458" y="150" width="188" height="270" rx="22" fill="#ffffff" stroke="#dfeaf7"/>
    <rect x="1477" y="170" width="64" height="22" rx="11" fill="#5e70f5"/>
    <text x="1509" y="186" text-anchor="middle" class="tag">BI</text>
    <text x="1552" y="228" text-anchor="middle" class="label">Decisão</text>
    <rect x="1477" y="245" width="150" height="32" rx="9" fill="#eef4ff"/>
    <text x="1552" y="266" text-anchor="middle" class="card">Análise estratégica</text>
    <rect x="1477" y="290" width="150" height="32" rx="9" fill="#eef4ff"/>
    <text x="1552" y="311" text-anchor="middle" class="card">Comparação de mercado</text>
    <rect x="1477" y="335" width="150" height="32" rx="9" fill="#eef4ff"/>
    <text x="1552" y="356" text-anchor="middle" class="card">Ação e planeamento</text>
  </g>

  <g>
    <line x1="510" y1="285" x2="510" y2="308" stroke="#afbed0" stroke-width="2" stroke-dasharray="5 6"/>
    <line x1="780" y1="285" x2="780" y2="308" stroke="#afbed0" stroke-width="2" stroke-dasharray="5 6"/>
    <line x1="1092" y1="285" x2="1092" y2="308" stroke="#afbed0" stroke-width="2" stroke-dasharray="5 6"/>
    <line x1="1380" y1="285" x2="1380" y2="308" stroke="#afbed0" stroke-width="2" stroke-dasharray="5 6"/>
  </g>
</svg>
